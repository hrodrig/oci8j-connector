# Oracle 8i Connector - Configuration Example
# Copy this file to config.yaml and update with your actual values.
# Prefer secrets via env vars in Docker/K8s — never commit real credentials.

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: oracle8i-connector

  logging:
    level:
      com.connectors.oracle8i: DEBUG
      org.springframework.jdbc: DEBUG
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Oracle 8i (env: ORACLE_HOST, ORACLE_PORT, ORACLE_SID, ORACLE_USERNAME, ORACLE_PASSWORD)
oracle8i:
  host: 1.2.3.4
  port: 1521
  sid: orcl
  username: username
  password: password
  driver: oracle.jdbc.driver.OracleDriver
  connection_timeout: 30000
  socket_timeout: 60000
  query_timeout: 120000

oracle:
  jdbc:
    timezoneAsRegion: false
  net:
    ns:
      SQLnetDef:
        TCP_CONNTIMEOUT: 10000
        TCP_RECVTIMEOUT: 10000

app:
  name: Oracle 8i Connector
  version: 1.0.0                   # Display-only; runtime /info uses build VERSION
  description: Oracle 8i connector using classes12.jar

# Basic Auth (env: BASIC_AUTH_ENABLED, BASIC_AUTH_USERNAME, BASIC_AUTH_PASSWORD)
basic_auth:
  enabled: false
  username: admin
  password: secretpassword

# SQL keyword blocking
security:
  # Example: [DROP, TRUNCATE, DELETE]
  forbidden_keywords: []

# --- SPEC §7 edge / probes (v1.4) ---
# Env overrides: TRUSTED_PROXIES, ALLOWED_CIDRS, PROBES_PUBLIC, PROBES_ALLOWED_CIDRS
edge:
  # Peer CIDRs trusted for X-Forwarded-For / X-Real-IP (empty = ignore forwarded headers)
  trusted_proxies: ""
  # API allow-list for /query, /info, etc. (empty = no IP filter)
  allowed_cidrs: ""
  # Probes /healthz /ready /readyz — skip Basic Auth when true (default)
  probes_public: true
  # Probe-only IP allow-list (empty = no probe IP filter; independent of allowed_cidrs)
  probes_allowed_cidrs: ""

# --- SPEC §7 hardening (v1.4) ---
# Env overrides: RATE_LIMIT_MAX, RATE_LIMIT_WINDOW_SECONDS, CORS_ORIGINS
hardening:
  # Max requests per window per client IP (0 = disabled). Probes exempt.
  rate_limit_max: 0
  rate_limit_window_seconds: 60
  # CORS origins CSV. Empty = * (startup warn if Basic Auth off)
  cors_origins: ""

# OpenAPI / Swagger (phase 4) — keep false in production
# Env: OPENAPI_ENABLED
openapi:
  enabled: false
