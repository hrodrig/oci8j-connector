spring:
  profiles:
    active: default
  config:
    import: classpath:config.yaml

# Prefer JSON /error over Whitelabel HTML
server:
  error:
    whitelabel:
      enabled: false

# Basic Authentication (optional)
# Only enabled if both username and password are provided
basic_auth:
  enabled: false
  username: ${BASIC_AUTH_USERNAME:}
  password: ${BASIC_AUTH_PASSWORD:}

# Edge identity (SPEC §7.2) — also bind via env TRUSTED_PROXIES / ALLOWED_CIDRS
# Empty = disabled (ignore XFF; no API IP allow-list)
