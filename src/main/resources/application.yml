spring:
  profiles:
    active: default
  config:
    import: classpath:config.yaml

# Prefer JSON /error over Whitelabel HTML
server:
  error:
    whitelabel:
      enabled: false

# Basic Authentication (optional)
# Only enabled if both username and password are provided
basic_auth:
  enabled: false
  username: ${BASIC_AUTH_USERNAME:}
  password: ${BASIC_AUTH_PASSWORD:}

# Edge / probes / hardening / openapi — nested keys in config.yaml (SPEC §7)
# springdoc defaults off; OpenApiEnvironmentPostProcessor enables for dev/local or openapi.enabled
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
