spring:
  profiles:
    active: default
  config:
    import: classpath:config.yaml

# Prefer JSON /error over Whitelabel HTML
server:
  error:
    whitelabel:
      enabled: false

# Basic Authentication (optional)
# Only enabled if both username and password are provided
basic_auth:
  enabled: false
  username: ${BASIC_AUTH_USERNAME:}
  password: ${BASIC_AUTH_PASSWORD:}

# Edge identity (SPEC §7.2) — env: TRUSTED_PROXIES / ALLOWED_CIDRS
# Probe access (SPEC §7.2.1) — env: PROBES_PUBLIC (default true) / PROBES_ALLOWED_CIDRS
