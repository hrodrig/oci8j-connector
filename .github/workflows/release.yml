# Release on tag push v* — JAR + linux/amd64 image to ghcr.io + SBOM.
# Run make release-check locally before tagging.
name: Release

permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Read VERSION
        id: ver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Verify tag matches VERSION
        run: |
          EXPECTED="v${{ steps.ver.outputs.version }}"
          ACTUAL="${GITHUB_REF_NAME}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag $ACTUAL does not match VERSION file ($EXPECTED)"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Release checks (lint, test, package, docker-scan)
        run: make release-check

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hrodrig/oci8j-connector:v${{ steps.ver.outputs.version }}
            ghcr.io/hrodrig/oci8j-connector:latest

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (image)
        run: |
          mkdir -p dist
          syft "ghcr.io/hrodrig/oci8j-connector:v${{ steps.ver.outputs.version }}" \
            -o spdx-json="dist/oci8j-connector-${{ steps.ver.outputs.version }}.spdx.json"

      - name: Generate SBOM (JAR)
        run: |
          syft "target/oracle8i-connector-${{ steps.ver.outputs.version }}.jar" \
            -o spdx-json="dist/oracle8i-connector-${{ steps.ver.outputs.version }}-jar.spdx.json"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {grab=1; next}
            grab && $0 ~ /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > dist/release-notes.md || true
          if [ ! -s dist/release-notes.md ]; then
            echo "Release v${VERSION}" > dist/release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            target/oracle8i-connector-${{ steps.ver.outputs.version }}.jar
            dist/oci8j-connector-${{ steps.ver.outputs.version }}.spdx.json
            dist/oracle8i-connector-${{ steps.ver.outputs.version }}-jar.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
