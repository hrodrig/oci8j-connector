version: '3.8'

services:
  oracle8i-connector:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ORACLE_HOST=1.2.3.4
      - ORACLE_PORT=1521
      - ORACLE_SID=orcl
      - ORACLE_USERNAME=username
      - ORACLE_PASSWORD=password
    volumes:
      - ./lib:/app/lib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/oci8j-connector/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
