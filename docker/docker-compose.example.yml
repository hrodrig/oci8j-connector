# Default: pull published image from GHCR (linux/amd64).
# Override tag: OCI8J_IMAGE=ghcr.io/hrodrig/oci8j-connector:v1.4.0
# Local Dockerfile build: uncomment `build:` below and comment out `image:` (or set both:
#   image tags the build result — then `docker compose up --build`).

services:
  oci8j-connector:
    image: ${OCI8J_IMAGE:-ghcr.io/hrodrig/oci8j-connector:v1.4.0}
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Oracle Database Configuration
      - ORACLE_HOST=your-oracle-host
      - ORACLE_PORT=1521
      - ORACLE_SID=your-sid
      - ORACLE_USERNAME=your-username
      - ORACLE_PASSWORD=your-password
      # Query timeout (in milliseconds)
      - ORACLE_QUERY_TIMEOUT=120000
      # Basic Authentication (optional)
      - BASIC_AUTH_ENABLED=false
      - BASIC_AUTH_USERNAME=admin
      - BASIC_AUTH_PASSWORD=your-secret-password
      # SPEC §7 edge / probes (optional; empty = defaults)
      - TRUSTED_PROXIES=
      - ALLOWED_CIDRS=
      - PROBES_PUBLIC=true
      - PROBES_ALLOWED_CIDRS=
      # SPEC §7 hardening (optional; RATE_LIMIT_MAX=0 disables)
      - RATE_LIMIT_MAX=0
      - RATE_LIMIT_WINDOW_SECONDS=60
      - CORS_ORIGINS=
      # OpenAPI / Swagger (keep false in production)
      - OPENAPI_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/oci8j-connector/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
