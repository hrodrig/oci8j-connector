# TLS via Traefik v3 — copy to docker-compose.traefik.yml and edit secrets.
# Requires:
#   certs/fullchain.pem + privkey.pem
#   cp traefik/traefik.yml.example traefik/traefik.yml
#   cp traefik/dynamic.yml.example traefik/dynamic.yml
#
#   docker compose -f docker-compose.traefik.yml up -d --build
#   https://oci8j.local/api/v1/oci8j-connector/healthz  (hosts: 127.0.0.1 oci8j.local)

networks:
  oci8j-tls:
    name: oci8j-tls
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24

services:
  traefik:
    image: traefik:v3.3
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    networks:
      - oci8j-tls
    restart: unless-stopped

  oci8j-connector:
    image: ${OCI8J_IMAGE:-ghcr.io/hrodrig/oci8j-connector:v1.4.0}
    # build:
    #   context: ../..
    #   dockerfile: docker/Dockerfile
    environment:
      - ORACLE_HOST=your-oracle-host
      - ORACLE_PORT=1521
      - ORACLE_SID=your-sid
      - ORACLE_USERNAME=your-username
      - ORACLE_PASSWORD=your-password
      - ORACLE_QUERY_TIMEOUT=120000
      - BASIC_AUTH_ENABLED=false
      - BASIC_AUTH_USERNAME=admin
      - BASIC_AUTH_PASSWORD=your-secret-password
      - TRUSTED_PROXIES=172.28.10.0/24
      - ALLOWED_CIDRS=
      - PROBES_PUBLIC=true
      - PROBES_ALLOWED_CIDRS=
      - RATE_LIMIT_MAX=0
      - RATE_LIMIT_WINDOW_SECONDS=60
      - CORS_ORIGINS=
      - OPENAPI_ENABLED=false
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=oci8j-tls
      - traefik.http.routers.oci8j.rule=Host(`oci8j.local`)
      - traefik.http.routers.oci8j.entrypoints=websecure
      - traefik.http.routers.oci8j.tls=true
      - traefik.http.services.oci8j.loadbalancer.server.port=8080
    networks:
      - oci8j-tls
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/oci8j-connector/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
